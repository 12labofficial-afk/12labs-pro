name: 🔒 Secret Scanning

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  secret-detection:
    runs-on: ubuntu-latest
    name: Detect Secrets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: GitGuardian Scan
        uses: gitguardian/ggshield-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          scanners: secret

  env-validation:
    runs-on: ubuntu-latest
    name: Validate Environment Setup
    steps:
      - uses: actions/checkout@v4

      - name: Check for .env files
        run: |
          if git ls-files | grep -E '^\.env($|\..*$)' | grep -v '\.example'; then
            echo "❌ ERROR: .env files found in git"
            exit 1
          fi
          echo "✅ No .env files in git"

      - name: Validate .env.example files exist
        run: |
          if [ ! -f ".env.example" ] && [ ! -f "functions/.env.example" ] && [ ! -f "server-files/vercel.env.example" ]; then
            echo "⚠️  WARNING: No .env.example files found"
          else
            echo "✅ Example env files present"
          fi

      - name: Check for hardcoded API keys
        run: |
          set +e
          FOUND=0

          # Check for common patterns
          if git diff origin/${{ github.base_ref }} HEAD --name-only | xargs git show HEAD:{} 2>/dev/null | grep -iE '(sk_|pk_|AIza|AKIA|ghp_|SG\.)'; then
            echo "❌ Potential API keys detected"
            FOUND=1
          fi

          if [ $FOUND -eq 1 ]; then
            exit 1
          fi
          echo "✅ No hardcoded API keys detected"

  npm-audit:
    runs-on: ubuntu-latest
    name: NPM Audit
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for vulnerable packages
        run: pnpm audit --json > audit-results.json || true
        continue-on-error: true
